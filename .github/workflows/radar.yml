name: Radar Diario Oficial

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

concurrency: radar-pipeline

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          pip install -r requirements.txt
          python -m pytest tests/ -v --tb=short

      - name: Build image
        run: docker build -t radar-diario .

      - name: Validar secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          faltantes=0
          for var in GEMINI_API_KEY EMAIL_USER EMAIL_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "ERROR: Secret $var está vacío."
              echo "       Configúralo en Settings > Secrets and variables > Actions."
              faltantes=$((faltantes + 1))
            fi
          done
          if [ "$faltantes" -gt 0 ]; then
            echo "Abortando: faltan $faltantes secret(s) requerido(s)."
            exit 1
          fi
          echo "OK: todos los secrets requeridos están presentes."

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
        run: |
          docker run --rm \
            -u root \
            -v "$(pwd)/estado.json:/app/estado.json" \
            -e GEMINI_API_KEY -e EMAIL_USER -e EMAIL_PASSWORD -e EMAIL_DESTINATARIO \
            radar-diario

      - name: Guardar último estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add estado.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar último estado del pipeline"
            git push
          fi
          echo "Estado sincronizado con el repositorio."
